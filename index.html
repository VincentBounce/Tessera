<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tessera — Game of Life on tilings and surfaces · Walking on numbers</title>
  <meta name="description" content="Conway's Life, Langton's loops and reversible rules on hexagons, Penrose, pentagons, tori, Möbius strips, cubes… and the digits of π, e, φ walked in any base. In the browser, free.">
  <meta property="og:title" content="Tessera — Game of Life on tilings and surfaces · Walking on numbers">
  <meta property="og:description" content="Conway's Life, Langton's loops and reversible rules on hexagons, Penrose, pentagons, tori, Möbius strips, cubes… and the digits of π, e, φ walked in any base. In the browser, free.">
  <meta property="og:url" content="https://vincentbounce.github.io/Tessera/">
  <meta property="og:type" content="website">
  <link id="favicon" rel="icon">  <!-- the app's logo, set at start-up (see LOGO_PATH) -->
  <link rel="stylesheet" href="style.css?v=0.5.848">
  <script>  // the theme before the first paint (see applyTheme)
    try { const t = localStorage.getItem('tesseraTheme'); document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <header>
    <div class="header-row">
      <div id="modeTabs" class="tabs" role="tablist"></div>
      <div class="header-end">
        <div class="stepper max-steps">  <!-- the length asked, steps at most (a walk's, a creature's, Elementary's and Space-time's generations): kept in every tab, set before going there -->
          <button id="digitsDown" type="button" title="Fewer steps">−</button>
          <span class="field"><input id="digitsLabel" type="text" inputmode="numeric" maxlength="12" spellcheck="false" autocomplete="off"><button class="enter" type="button" tabindex="-1" title="Apply (Enter)">↵</button><span id="waitGauge" hidden><span class="wait-fill"></span><span class="wait-words"></span></span></span>  <!-- waitGauge: a long wait's, over the length (see showWaits) -->
          <button id="digitsUp" type="button" title="More steps">+</button>
        </div>
        <div class="tabs"><button id="appTab" type="button" class="pane-tab" title="Credits: the people whose work it shows, Share link and Home"></button></div>  <!-- the app's tab: π, its name and version, a pane's tab as Gallery's -->
      </div>
    </div>
  </header>

  <main>
    <h1 class="visually-hidden">Tessera</h1>  <!-- the page's title, its name shown by its tab (see appTab) -->
    <aside class="panel">
      <div id="paramsPane">
      <section>
        <div class="walk-head">
          <h2 id="walkHeading">Walk</h2>
        </div>
        <div id="navSpace" class="nav-shapes"></div>
        <h3 id="shapesLabel"></h3>
        <div id="navShapes" class="nav-shapes"></div>
        <h3 id="ringShapeLabel" hidden></h3>
        <div id="ringShapeTabs" class="nav-shapes" hidden></div>  <!-- a ring's shapes (see RING_SHAPES) -->
        <div id="shapeRow" class="pill-row" hidden>  <!-- Shape: its slider in a pill's track, its ends' names in it (see updateMorphButton) -->
          <h3>Shape</h3>
          <div class="shape-slider" title="The same cells, from flat to round: drag (the walk goes on meanwhile)"><span id="shapeFlat"></span><span id="shapeRound"></span><input id="shapeM" type="range" min="0" max="1" step="0.01" aria-label="From flat to round"></div>
        </div>
        <h3 id="tilesLabel" hidden></h3>
        <div id="torusTiles" class="nav-shapes" hidden role="tablist"></div>
        <div id="sizeRow" hidden>  <!-- a surface's size, under its tiles -->
          <h3>Size</h3>
          <div id="sizeBox">  <!-- − + its label and its sliders, one block: hovered, its tooltip (see sizeTips); − and +, its motif too -->
            <div class="stepper">
              <button id="sizeDown">−</button>
              <span id="sizeLabel"></span>
              <button id="sizeUp">+</button>
            </div>
            <div id="sizeGauge" class="size-gauge" hidden></div>
            <div class="pill-row" hidden><h3>Width</h3><div id="widthGauge" class="size-gauge shape-slider"></div></div>  <!-- a torus's, a strip's, a bottle's width round it (see widthsOf), a slider as Glint's -->
            <div class="pill-row" hidden><h3>Twist</h3><div id="twistGauge" class="size-gauge shape-slider"></div></div>  <!-- a torus's twist at its seam (see torusTwist) -->
          </div>
          <select id="gridSizeField" hidden></select>
        </div>
        <div id="planeRow" hidden>  <!-- Life on the plane: its outline and walls or a torus, its size -->
          <div id="planeOutline"><h3>Outline</h3>
          <div id="planeEdges" class="nav-shapes"></div></div>  <!-- (none on a grid that never repeats: always walls) -->
          <h3>Size</h3>
          <div id="planeBox">  <!-- as the surfaces' (sizeBox) -->
            <div class="stepper">
              <button id="planeDown">−</button>
              <span id="planeLabel"></span>
              <button id="planeUp">+</button>
            </div>
            <div id="planeGauge" class="size-gauge" hidden></div>
          </div>
        </div>
        <div id="surfaceRow" hidden>
          <input id="startNo" type="hidden" value="1">
          <div id="loopRow" class="stepper" title="The sizes and starts where this fraction's chain closes in the fewest laps around the ring and the tube" hidden>
            <button id="loopDown" title="Previous loop">−</button>
            <span id="loopLabel"></span>
            <button id="loopUp" title="Next loop">+</button>
          </div>
        </div>
      </section>

      <section id="exploreSection" hidden>  <!-- Explore: its cells' colours, by a rule and a palette (see exploreLevels) -->
        <h2 data-icon="eye">Colours</h2>
        <div id="exploreRules" class="mode-list rule-cards" role="listbox"></div>  <!-- its rules, as cards (see card) -->
        <div id="distanceRow" class="pill-row"><h3>Colours</h3><div id="distanceGauge" class="size-gauge shape-slider" title="Distance's colours: so many of the palette's, a ring each in turn"></div></div>  <!-- Distance's colours, under its card (see renderExplore, DISTANCE_COLOURS) -->
        <div id="explorePalettes" class="nav-shapes"></div>
      </section>

      <section id="antStartSection" hidden>  <!-- a creature's start: by its rule or by the digits (a turmite: by its rule only) -->
        <h2 data-icon="play">Start</h2>
        <div id="antStartTabs" class="nav-shapes"></div>  <!-- by its rule or by the digits: one choice, a tab group of tiles (as Life's starts) -->
        <div id="antStartDigits"></div>  <!-- by the digits: the number (see numberPicker) -->
      </section>

      <section id="colourSection" hidden>  <!-- Life: alive or dead, or 2 to 12 civilisations; a walk on a surface: 1 to 12 numbers walking (see renderTeams) -->
        <h2 data-icon="duel">Teams</h2>
        <div id="colourBlocks" class="nav-shapes colour-blocks"></div>
        <div id="teamsZones"></div>  <!-- how the figure shown lays its teams, shown only (see zoneShapeOf) -->
      </section>

      <section id="startSection" hidden>  <!-- Life: how the cells start (the plane), or the hunt for a lasting start (the surfaces) -->
        <h2 data-icon="play">Start</h2>
        <div id="lifeStartRow" hidden>  <!-- Life on the plane: how the cells start -->
          <div id="lifeStartTabs" class="nav-shapes"></div>  <!-- the starts: Hunt (Random for blocks), Text, Digits, Draw: one choice, a tab group of tiles (see START_TABS) -->
          <div id="startText" class="start-panel" hidden>  <!-- Text: a word or an emoji drawn on the grid, its dark pixels alive -->
            <span class="field"><textarea id="startTextInput" class="custom" rows="10" maxlength="240" autocomplete="off" spellcheck="false" title="Words, letters or emoji, a line each (Enter: a new line); drawn by a click outside or ⌘ Enter"></textarea></span>
            <div id="textButtons" class="nav-shapes"></div>  <!-- Cancel, OK: greyed while the words are those drawn (see syncTextButtons) -->
            <div id="textFonts" class="nav-shapes"></div>  <!-- its font (see TEXT_FONTS) -->
          </div>
          <div id="startDraw" class="start-panel">  <!-- Draw: a brush (a cell, or a pattern turned as chosen), in a colour or the eraser -->
            <div class="tool-block">
              <button id="drawView" class="wide" data-icon="eye" data-toggle type="button" title="To look: a click draws nothing, the brush picked kept (on away from gen 0: Play, a step, End; a brush picked draws again, at gen 0)">View (Escape)</button>
              <div id="brushCards" class="mode-list rule-cards" role="listbox"></div>
              <p id="drawNote" class="caption" hidden>No known patterns for this rule on this grid</p>  <!-- a surface, a rule with none -->
              <div id="brushTurns" class="nav-shapes"></div>  <!-- the brush's turn and Mirror (see drawRow) -->
              <div id="drawHistoryTools" class="nav-shapes"></div>  <!-- Undo and Redo: the drawing's history (see drawHistory) -->
            </div>
            <div class="draw-row"><span id="brushColours" class="colour-swatches"></span></div>
            <div class="tool-block">
              <button id="startCells" type="button" class="wide" data-icon="trash" title="Clears the cells drawn">Clear</button>  <!-- the cells drawn cleared (see renderDrawTools) -->
            </div>
          </div>
          <div id="startDigits" class="start-panel" hidden></div>  <!-- Digits: the number whose digits lay the cells (see numberPicker) -->
        </div>
        <div id="huntZones" class="nav-shapes" hidden></div>  <!-- the hunt's zones (a reversible rule's: its random starts'), with the hunt -->
        <div id="seedField" class="notch-field" hidden title="Seed's patches: their radius round each colour's spot, a notch each">  <!-- Seed's radius: a notched slider, its patches' width at its right (see renderSeed) -->
          <span id="seedGauge" class="size-gauge"></span><span id="seedLabel" class="notch-words"></span>
        </div>
        <div id="symmetryRow" hidden>  <!-- Life on the plane: the start copied by a symmetry of the grid, under the zones (a zone's sub-mode) -->
          <h4>Symmetry</h4>
          <div id="symmetryTiles" class="nav-shapes"></div>
        </div>
      </section>

      <section id="walkStartSection">  <!-- a walk's start, as Life's: its start on a surface (startRow, placed by the mode: a creature's in its own Start, see renderAntRow), then the number walked (a start's by the digits, Life's or a creature's, under its Digits tab), or a battle's numbers -->
        <h2 data-icon="play">Start</h2>
        <div id="startRow" class="stepper" title="Turned copies of a start draw the same walk, turned: one start per different walk. Hover to see them all" hidden>
          <button id="startDown" title="Previous start">−</button>
          <span class="field"><input id="startLabel" type="text" inputmode="numeric" maxlength="7" spellcheck="false" autocomplete="off" title="Type a start number, then Enter"><button class="enter" type="button" tabindex="-1" title="Start here (Enter)">↵</button></span>
          <button id="startUp" title="Next start">+</button>
        </div>
        <div id="numberPicker">  <!-- the number, its formula, its tabs, its primes' menus: one block, placed by the mode -->
          <div id="numberTabs"></div>  <!-- ℚ ℝ ℙ 🎲, the formula under them (see renderNumberPicker) -->
          <div id="numberList"></div>
          <label id="mersenneRow" hidden>
            <select id="mersenneP"></select>
          </label>
          <label id="primorialRow" hidden>
            <select id="primorialP"></select>
          </label>
        </div>
        <div id="battleStart" hidden>  <!-- a battle's: how they fight, each walker's formula (A's the number's own, moved here: see renderWalkTeams), Random, the longest battles (see 7.6c) -->
          <div id="startWays" hidden></div>  <!-- a battle's starts: Symmetric, Centred, Random, over the start row (see renderWalkTeams) -->
          <h3>Walkers</h3>
          <div class="stack">  <!-- the walkers' formulas, as close as cards, then their first numbers and Roll -->
            <div id="formulaAHome"></div>  <!-- (the number's formula field, A's in a battle) -->
            <div id="rivalFormulas"></div>  <!-- the other walkers' formulas, B to L (see formulaField) -->
            <div id="battleNumbers" class="nav-shapes"></div>  <!-- the walkers' first numbers (see battleFirsts), Roll (see battleRandom) -->
          </div>
          <h3>Battle rule</h3>
          <div id="battleRuleCards" class="mode-list rule-cards" role="listbox"></div>  <!-- a battle's way with an enemy's body: the Land grids, Land cells, Cut, Land no collision, as cards (see BATTLE_RULES) -->
        </div>
      </section>

      <section id="huntSection">  <!-- every mode's hunt, one block shown at most (its own condition), the section with none hidden (style.css) -->
        <h2 data-icon="search">Hunt</h2>
        <div id="huntRow" hidden>  <!-- Life, in 1 to 12 colours: a hunt for the longest life, or long, even battles -->
          <div id="huntGoals" class="nav-shapes"></div>  <!-- what the hunt looks for, over its button -->
          <button id="huntBtn" type="button" class="wide"></button>  <!-- its words in its tooltip: the hunt and the zone (see renderHunt) -->
          <p id="huntStatus" class="muted"></p>
          <div id="huntTop" class="mode-list" role="listbox"></div>
        </div>
        <div id="battleHunt" hidden>  <!-- a battle of walkers: the longest battles -->
          <div id="battleHuntVary" class="nav-shapes"></div>  <!-- what the hunt varies: Formulas, Starts (see renderBattleHunt) -->
          <div id="battleHuntRank" class="nav-shapes"></div>  <!-- what it ranks: Longest, Even lands, Latest first stop (see HUNT_RANKS) -->
          <button id="battleHuntBtn" type="button" class="wide"></button>  <!-- its words and tooltip: see renderBattleHunt -->
          <p id="battleHuntStatus" class="muted"></p>
          <div id="battleHuntTop"></div>  <!-- the 8 longest battles, each group its title over its list: a click plays one -->
        </div>
        <div id="returnRow" hidden>  <!-- a reversible one: its return to its start, past what is played -->
          <button id="backBtn" type="button" class="wide" title="Steps its start on, past what is played, till it comes back to it (a reversible rule always does). Recommended on a small grid: a large one's start comes back after far too many gens to be found"></button>  <!-- blocks: see searchBack -->
        </div>
      </section>

      <section id="walkRuleSection">  <!-- a walk's rule or a creature's (Ant, Turmite, Worm): its rules' cards (a command per digit), Spiral; a walk's along the grid or on cells -->
        <h2 data-icon="turtle">Walking rule</h2>
        <div id="walkOn" class="nav-shapes"></div>  <!-- along the grid, or on cells: one choice, a tab group of tiles (as the Start's), first, above How it works -->
        <button id="walkRuleHow" class="wide how-it-works on-list" data-icon="info" type="button" title="The rule in use, step by step: what each cell (each step) sees, and what it does (a click on a rule card's picture, too)">How it works</button>  <!-- how the rule works (see walkTutorialToggle), on its first card -->
        <div id="navRules" class="mode-list rule-cards" role="listbox"></div>  <!-- the rules of that shape, where there are several; a walk by a rule: its rules' cards; a creature's, the creatures, the one in use with its rules (see ruleCards) -->
        <div id="antCustomRow" hidden><h3 id="antRuleName"></h3>  <!-- not a label: a click on ↵ would focus the field again; moved right after its card (see ruleCards) -->
          <span class="field"><input id="antRule" class="custom rule" type="text" autocomplete="off" spellcheck="false" title="Type a rule, then Enter"><button class="enter" type="button" tabindex="-1" title="Apply (Enter)">↵</button></span>
        </div>
        <select id="variant" hidden></select>  <!-- the tab's variant (see tabVariant): its options made from the variants -->
      </section>


      <section id="automataSection" hidden>  <!-- Life: its rule -->
        <h2 data-icon="glider">Rule</h2>
        <div id="ruleTabs" class="nav-shapes"></div>  <!-- Elementary's: Main | Others -->
        <button id="watchRule" class="wide how-it-works on-list" data-icon="info" type="button" title="The rule in use, step by step: what each cell (each step) sees, and what it does (a click on a rule card's picture, too)">How it works</button>  <!-- how the rule in use works (see ruleTutorial), on its first card -->
        <div id="ruleCards" class="mode-list rule-cards" role="listbox"></div>  <!-- the rules for the grid's shape, as cards -->
        <div class="rule-build">  <!-- your own: the states (a cell's: alive, its dying stages, dead), how many live neighbours give birth, let survive -->
          <div id="ruleCountTabs"></div>  <!-- by counts of live neighbours (the chips) or by shares of them, in % (the sliders) -->
          <div class="build-cols">  <!-- two frames side by side: Birth, Survive -->
            <div class="build-box"><h4>Birth<span id="birthShares" class="range-words"></span></h4><div id="ruleBirth" class="nchips"></div></div>  <!-- (a share rule's: its intervals' words under its name, its sliders in the chips' place) -->
            <div class="build-box"><h4>Survive<span id="surviveShares" class="range-words"></span></h4><div id="ruleSurvive" class="nchips"></div></div>
          </div>
          <div id="statesRow" class="stepper">  <!-- the states: alive, its dying stages, dead -->
            <button id="statesDown" type="button" title="Fewer states: one dying stage less">−</button>
            <span id="statesLabel"></span>
            <button id="statesUp" type="button" title="More states: one dying stage more">+</button>
          </div>
        </div>
        <div id="lifeCustomRow">
          <span class="field"><input id="lifeRule" class="custom rule" type="text" value="B3/S23" autocomplete="off" spellcheck="false" title="Type a rule, then Enter"><button class="enter" type="button" tabindex="-1" title="Apply (Enter)">↵</button></span>
        </div>
      </section>

      </div>
    </aside>
    <div id="galleryPane" hidden>  <!-- its tools in a band at its top, fixed; its setups scrolling under it (#galleryScroll) -->
      <div class="gallery-band">  <!-- the Gallery (kept in this browser only): its tools; its files Import and Export; Save: the ☆ of Gallery's tab -->
        <div class="gallery-tools-row">  <!-- on the left Open and Paste RLE; in the middle the setup in view's; on the right the selection's tools, then the Gallery's -->
          <div id="galleryOpenTiles" class="gallery-left nav-shapes"></div>  <!-- Open and Paste RLE: a pattern in the nearest setup that plays it -->
          <div class="gallery-in-view">
            <div id="galleryShareTiles" class="nav-shapes"></div>  <!-- Share link -->
            <button id="inViewPicture" type="button"></button>  <!-- the setup in view's picture, the band's height: its words in its tooltip -->
            <div id="galleryStarTiles" class="nav-shapes"></div>  <!-- Star -->
          </div>
          <div class="gallery-tools">
            <div id="gallerySelectTiles" class="nav-shapes"></div>  <!-- Select: none, some, all (see syncSelection) -->
            <div id="galleryTools" class="nav-shapes"></div>  <!-- Refresh, Delete, Import, Export -->
          </div>
        </div>
        <input id="galleryFile" type="file" accept="application/json,.json" hidden><input id="rleOpenFile" type="file" accept=".rle,.txt,text/plain" hidden>
      </div>
      <div id="galleryScroll"><div id="yourList" role="listbox"></div></div>  <!-- the Gallery: every tab's (see fillGalleryList) -->
    </div>

    <div id="stage" class="stage">
      <canvas id="gridLayer"></canvas>
      <canvas id="fillLayer"></canvas>
      <canvas id="gpuLayer"></canvas>  <!-- the surfaces, walks and Life, drawn by WebGPU (see 11.4d) -->
      <canvas id="pathLayer"></canvas>
      <canvas id="lineLayer"></canvas>
      <canvas id="hoverLayer"></canvas>  <!-- a size's motif, the starts: the others faded under it (see drawHover) -->
      <canvas id="overlayLayer"></canvas>
      <img id="stagePreview" alt="" hidden>  <!-- a Gallery card clicked: its thumbnail over the view while its setup is built (see setupRow) -->
      <div class="hint"><div id="tip"></div><div id="hint" hidden></div></div>  <!-- what the mouse is on: a tooltip, or on the view how to move it -->
      <div id="ruleTuto" class="rule-tuto" hidden></div>  <!-- how the rule picked works, in place of the grid (see ruleTutorial) -->
      <div id="animBar" class="stage-box stage-bar" tabindex="-1" aria-label="What is walked, animation and stats">  <!-- (tabindex: on a touch screen, a tap on it opens it) -->
        <div class="stage-more">  <!-- shown on hover, above the title: the bar grows upwards, its title, gauges and Play row stay where they were (a link in them clicked as it was seen) -->
          <p class="bar-sub"><button id="drawIt" class="head-btn" data-icon="pencil" type="button" title="The generation shown as the cells drawn, in Draw (Undo: the cells drawn before)">Draw it</button><button id="saveRle" class="head-btn" data-icon="export" type="button" title="Saves the generation shown as an RLE file, as Golly and LifeWiki read it">Save RLE</button><span id="description"></span><span id="status"></span></p>  <!-- Save RLE at its top right (greyed where no grid laid in rows, see rleLaid); the walk, then how its digits came (computing, an error…) -->
          <div id="ruleChips" class="rule-chips"></div>
          <div id="gauges" class="stat-table" hidden></div>  <!-- one colour: alive, its peak, order…; a walk: its position, its distance, its peak, its cells (open only) -->
          <div id="digitStrip" class="strip" aria-label="Recent digits"></div>
          <canvas id="activity" class="activity" aria-label="Activity: a walk's distance from its start, Life's live cells"></canvas>
        </div>
        <div class="step-line"><span id="stepNow"></span><span id="stepLast"></span><span id="stepEnd"></span><span id="barLoop" class="bubble gold" hidden></span></div>  <!-- the step or generation shown (open: its last after it, see updateStats) -->
        <div class="bar-title"><span id="barNum" class="bar-num"></span><button id="barBase" class="bubble" type="button"></button><button id="barRule" class="bubble how-it-works" type="button" hidden></button><button id="barBattle" class="bubble how-it-works" type="button" hidden></button></div>
        <div id="ranking" class="stat-table" hidden></div>  <!-- a battle: the colours ranked by live cells, those died out last -->
        <div class="player-controls">  <!-- the buttons, as wide folded or not; on hover, the speed on their right -->
          <div class="player-main">
            <div class="row play-row">
              <button id="restart" data-icon="start" title="Jump to the start, through its stops" aria-label="Jump to the start"></button>
              <button id="back" data-icon="back" title="One step back; a Game of Life's computed again from gen 0 (no rule backwards), at once round its loop" aria-label="One step back"></button>
              <button id="reverse" data-icon="reverse" title="Play backwards, back to the start (its rule run backwards)" aria-label="Play backwards"></button>
              <button id="stop" data-icon="stop" title="Stop" aria-label="Stop"></button>
              <button id="play" title="Play" aria-label="Play"></button>
              <button id="step" data-icon="step" title="One step" aria-label="One step"></button>
              <button id="end" data-icon="end" title="Jump to the end, through its stops" aria-label="Jump to the end"></button>  <!-- (a run with an end known: a walk's at once; Life's, a reversible one's, once its loop is found: +10k till then) -->
              <button id="jump10k" title="10,000 gens ahead (E, while its end is not known)">+10k</button>
            </div>
          </div>
          <div class="player-side">
            <div id="speedField" class="notch-field" title="The speed: steps (or generations) a second, a notch each, as played at the screen's rhythm">  <!-- the speed: a notched slider, the speed played at its right -->
              <span id="speedGauge" class="size-gauge"></span><span id="speedLabel" class="notch-words"></span>
            </div>
          </div>
        </div>
      </div>
      <div id="viewTools" class="stage-box display-menu">
        <div class="stage-head" id="viewHead">  <!-- its tiles on the right: the theme's switch always in sight; Sound and Auto-fit on its left while the box is open, Grid under them (see renderHeadTiles) -->
          <div id="headTiles" class="nav-shapes head-tiles"></div>
        </div>
        <div class="stage-more">  <!-- shown on hover, below -->
          <div>
            <div hidden>  <!-- Auto-fit's checkbox and Grid's level, the source (see renderHeadTiles) -->
              <label id="autoFitRow" title="Fit the view to the walk and keep it fitted; a double-click fits it again"><input id="autoFit" type="checkbox" checked></label>
              <input id="gridFinish" type="hidden" value="2">  <!-- Grid: its lines off or how marked, or Tiles' palette (see GRID_LINES, TILES_PALETTES) -->
              <input id="cellsFinish" type="hidden" value="0">  <!-- Cells: how a painted cell is lit (see CELLS_FINISHES) -->
            </div>
            <div id="gridFinishRow"></div>  <!-- Off, the lines' opacities and Tiles' palettes: pills (see pillRow, GRID_LINES) -->
            <div id="cellsFinishRow" hidden></div>  <!-- Off, Halo, LED…: pills (see pillRow, CELLS_FINISHES) -->
          </div>
          <div id="viewSection" class="form-section">  <!-- the view (View: its pills; its switches as tiles), then its form -->
            <div id="viewModes" hidden></div>  <!-- View: Default, Free, Upright, S, E, Up: pills (see pillRow, renderViewModes) -->
            <div hidden>  <!-- their checkboxes, the source (a row hidden: it does not apply) -->
              <label id="centeredRow" hidden title="On a solid, the camera faces the middle of a walk shown whole (a walker's name in the title clicked: the camera follows it); elsewhere, the camera as it starts (turning the view frees it)"><input id="centered" type="checkbox" checked> <span id="centeredName">Centered pattern</span></label>
              <label id="uprightRow" hidden title="The view from the front, level, a drag turning it round the vertical only"><input id="upright" type="checkbox"></label>
            </div>
            <div id="viewTiles" class="nav-shapes view-tiles" hidden></div>  <!-- the view's switches as tiles (see renderViewTiles) -->
            <div hidden>  <!-- their checkboxes, the source (a row hidden: it does not apply) -->
              <label class="check" id="perspectiveRow" hidden><input id="perspective" type="checkbox"> Perspective</label>
              <label class="check" id="lightRow" hidden title="A lamp at the top left, with its glints and shadows; off, lit from the front (from the viewer, no shadows)"><input id="light" type="checkbox"> Side light</label>
              <label class="check" id="glassRow" hidden title="The surface see-through: every layer shows, its grid and path too, what is nearer more; where it is seen edge on it reflects a sky, as glass does"><input id="glass" type="checkbox"> Glass</label>
              <label class="check" id="oceanRow" hidden title="Rainbow and battle colours in earth colours, on a sea blue"><input id="ocean" type="checkbox"> Earth</label>
              <label class="check" id="autoRotateRow" hidden title="Turn the view slowly, swaying up and down so that the top and the bottom show too; it starts Auto-fit, and a hand rotation stops it"><input id="autoRotate" type="checkbox"> Auto-rotate</label>
            </div>
            <div id="glintRow" class="pill-row" hidden>  <!-- Glint: a slider as Shape's (see showSliderAt) -->
              <h3>Glint</h3>
              <div class="shape-slider" title="The light's glint: in each tile's own colour, never past it, or white added on it (a pale face facing it washed white)"><span>Soft</span><span>Bright</span><input id="glintM" type="range" min="0" max="1" step="0.01" aria-label="From soft to bright"></div>
            </div>
            <div id="cutRow" hidden></div>  <!-- Off, S, E, Up: pills (see pillRow, CUT_AXES) -->
          </div>
          <div class="form-section">  <!-- what the walk shows: colours, areas, cells -->
            <div id="coloursRow"><div id="colourButtons" class="choice-list"></div></div>
            <div id="lifeTrailRow" hidden>  <!-- Trail, on or off: its tile goes after Life's looks (see renderColourButtons) -->
              <input id="lifeTrail" type="checkbox" checked hidden>
            </div>
            <select id="colourMode" hidden>
              <option value="gradient">Rainbow along the walk</option>
              <option value="cells">Rainbow cells along the walk</option>
              <option value="visits">Rainbow by number of visits</option>
              <option value="digit">One colour per digit</option>
              <option value="mono">One colour</option>
              <option value="domain">Domains</option>
              <option value="entropy">Entropy</option>
            </select>
            <div id="fillAreasRow" hidden>  <!-- the areas the walk closes: Empty, Light (translucent) or Plain -->
              <div id="areaModes"></div>  <!-- Empty, Light, Plain: pills (see pillRow) -->
              <span id="fillTooBig" class="fill-note" hidden title="Beyond 12 million tile corners in the walk's box, the areas are not filled">walk too big</span>
              <select id="area" hidden><option value="empty"></option><option value="light"></option><option value="plain"></option></select>
            </div>
            <div id="cellModes" class="nav-shapes cell-modes" hidden></div>  <!-- a walk's or an ant's cells: Path, Cell path, Commands or States (an ant), Heatmap -->
            <label class="check" id="showPathRow" hidden title="The walk's line over the cells it colours"><input id="showPath" type="checkbox"> Show path</label>
            <label class="check" id="heatmapRow" hidden title="The cells coloured by how often the walk comes back to them"><input id="heatmap" type="checkbox"> Heatmap of visits</label>
          </div>
        </div>
      </div>
      <div id="numberPreview" class="rule-tuto number-view" hidden></div>  <!-- over the whole view -->
    </div>
  </main>

  <script src="pixelarticons.js?v=0.5.848"></script>
  <script src="punks.js?v=0.5.848"></script>
  <script src="loops.js?v=0.5.848"></script>
  <script src="emoji.js?v=0.5.848"></script>
  <script src="debug.js?v=0.5.848"></script>  <!-- a panel to try settings by eye (see debugPanel) -->
  <script src="main.js?v=0.5.848"></script>
</body>
</html>
