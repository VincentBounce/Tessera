<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tessera — Game of Life on tilings, surfaces and solids · walking on digits</title>
  <meta name="description" content="Conway's Life, Langton's loops and reversible rules on hexagons, Penrose, pentagons, tori, Möbius strips, cubes… and the digits of π, e, φ walked in any base. In the browser, free.">
  <meta property="og:title" content="Tessera — an automata atlas and walking on digits">
  <meta property="og:description" content="Conway's Life, Langton's loops and reversible rules on hexagons, Penrose, pentagons, tori, Möbius strips, cubes… and the digits of π, e, φ walked in any base. In the browser, free.">
  <meta property="og:url" content="https://vincentbounce.github.io/Tessera/">
  <meta property="og:type" content="website">
  <link id="favicon" rel="icon">  <!-- the app's logo, set at start-up (see appLogo) -->
  <meta name="description" content="A walk on a grid in 2D or 3D driven by the base-2 to base-6 digits of π, other constants and large primes.">
  <link rel="stylesheet" href="style.css?v=0.4.715">
  <script>  // the theme before the first paint (see applyTheme)
    try { const t = localStorage.getItem('tesseraTheme') || 'system'; document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t; } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <header>
    <div class="header-row">
      <div id="modeTabs" class="tabs" role="tablist"></div>
      <div class="header-end">
        <div class="stepper max-steps">  <!-- the length asked, steps at most (a walk's, a creature's, Elementary's and Space-time's generations): kept in every tab, set before going there -->
          <button id="digitsDown" type="button" title="Fewer steps">−</button>
          <span class="field"><input id="digitsLabel" type="text" inputmode="numeric" maxlength="12" spellcheck="false" autocomplete="off"><button class="enter" type="button" tabindex="-1" title="Apply (Enter)">↵</button></span>
          <button id="digitsUp" type="button" title="More steps">+</button>
        </div>
        <div class="tabs"><button id="appTab" type="button" class="pane-tab" title="Credits: the people whose work it shows, Share link and Home (its version: 0.1.0 its first commit, +1 a commit)"></button></div>  <!-- the app's tab: π, its name and version, a pane's tab as Gallery's -->
      </div>
    </div>
  </header>

  <main>
    <aside class="panel">
      <div id="paramsPane">
      <section>
        <div class="walk-head">
          <h2 id="walkHeading">Walk</h2>
        </div>
        <div id="navSpace" class="nav-shapes"></div>
        <div id="shapesLabel" class="field-label"></div>
        <div id="navShapes" class="nav-shapes"></div>
        <div id="tilesLabel" class="field-label" hidden></div>
        <div id="torusTiles" class="nav-shapes" hidden role="tablist"></div>
        <div id="sizeRow" hidden>  <!-- a surface's size, under its tiles -->
          <div class="field-label">Size</div>
          <div id="sizeBox">  <!-- − + its label and its slider, one block: hovered, its motif and its tooltip (see sizeTips) -->
            <div class="stepper">
              <button id="sizeDown">−</button>
              <span id="sizeLabel"></span>
              <button id="sizeUp">+</button>
            </div>
            <div id="sizeGauge" class="size-gauge" hidden></div>
          </div>
          <select id="sphereF" hidden></select>
        </div>
        <div id="planeRow" hidden>  <!-- Life on the plane: its outline and walls or a torus, its size -->
          <div id="planeOutline"><div class="field-label">Outline</div>
          <div id="planeEdges" class="nav-shapes"></div></div>  <!-- (none on a grid that never repeats: always walls) -->
          <div class="field-label">Size</div>
          <div id="planeBox">  <!-- as the surfaces' (sizeBox) -->
            <div class="stepper">
              <button id="planeDown">−</button>
              <span id="planeLabel"></span>
              <button id="planeUp">+</button>
            </div>
            <div id="planeGauge" class="size-gauge" hidden></div>
          </div>
        </div>
        <div id="sphereRow" hidden>
          <input id="startNo" type="hidden" value="1">
          <div id="loopRow" class="stepper" title="The sizes and starts where this fraction's chain closes in the fewest laps around the ring and the tube" hidden>
            <button id="loopDown" title="Previous loop">−</button>
            <span id="loopLabel"></span>
            <button id="loopUp" title="Next loop">+</button>
          </div>
        </div>
      </section>

      <section id="antStartSection" hidden>  <!-- a creature's start: by its rule or by the digits (a turmite: by its rule only) -->
        <h2 data-icon="play">Start</h2>
        <div id="antStartTabs" class="nav-shapes"></div>  <!-- by its rule or by the digits: one choice, a tab group of tiles (as Life's starts) -->
        <div id="antStartDigits"></div>  <!-- by the digits: the number (see numberPicker) -->
      </section>

      <section id="colourSection" hidden>  <!-- Life: alive or dead, or 2 to 12 civilisations; a walk on a surface: 1 to 12 numbers walking (see renderTeams) -->
        <h2 data-icon="duel">Teams</h2>
        <div id="colourBlocks" class="nav-shapes colour-blocks"></div>
      </section>

      <section id="startSection" hidden>  <!-- Life: how the cells start (the plane), or the hunt for a lasting start (the surfaces) -->
        <h2 data-icon="play">Start<button id="copyRle" class="head-btn" data-icon="copy" type="button" title="Copies the generation shown as an RLE file, as Golly and LifeWiki read it">Copy RLE</button></h2>  <!-- the generation shown, as Golly's and LifeWiki's RLE (the plane) -->
        <div id="lifeStartRow" hidden>  <!-- Life on the plane: how the cells start -->
          <div id="lifeStartTabs" class="nav-shapes"></div>  <!-- the starts: Hunt (Random for blocks), Text, Digits, Draw: one choice, a tab group of tiles (see START_TABS) -->
          <div id="startText" class="start-panel" hidden>  <!-- Text: a word or an emoji drawn on the grid, its dark pixels alive -->
            <span class="field"><textarea id="startTextInput" class="custom" rows="10" maxlength="240" autocomplete="off" spellcheck="false" title="Words, letters or emoji, a line each (Enter: a new line); drawn by a click outside or ⌘ Enter"></textarea></span>
            <div id="textFonts" class="nav-shapes"></div>  <!-- its font (see TEXT_FONTS) -->
          </div>
          <div id="startDraw" class="start-panel">  <!-- Draw: a brush (a cell, or a pattern turned as chosen), in a colour or the eraser -->
            <button id="startCells" type="button" class="wide"></button>  <!-- the start's cells: Go to gen 0, Clear, Undo clear (see renderDrawTools) -->
            <div id="brushCards" class="mode-list rule-cards" role="listbox"></div>
            <p id="drawNote" class="caption" hidden>No known patterns for this rule on this grid</p>  <!-- a surface, a rule with none -->
            <div class="draw-row turn-row"><button id="brushTurn" type="button" title="A quarter turn more">↻ 0°</button><button id="brushFlip" type="button" title="Mirrored">⇋ Mirror</button></div>
            <div class="draw-row"><span id="brushColours" class="colour-swatches"></span></div>
            <div class="draw-row turn-row"><button id="openPng" type="button" title="Opens a black and white picture as the start, a pixel a square">Open PNG</button><button id="exportPng" type="button" title="Saves the generation shown as a black and white picture, a square a pixel">Export PNG</button><input id="pngFile" type="file" accept="image/*" hidden></div>  <!-- a black and white picture, a pixel a square (the grid fitted to it), or the generation shown as one -->
          </div>
          <div id="startDigits" class="start-panel" hidden></div>  <!-- Digits: the number whose digits lay the cells (see numberPicker) -->
        </div>
        <div id="huntZones" class="nav-shapes" hidden></div>  <!-- the hunt's zones (a reversible rule's: its random starts'), with the hunt -->
        <div id="symmetryRow" hidden>  <!-- Life on the plane: the start copied by a symmetry of the grid, under the zones (a zone's sub-mode) -->
          <div class="block-label">Symmetry</div>
          <div id="symmetryTiles" class="nav-shapes"></div>
        </div>
        <div id="huntRow" hidden>  <!-- Life, in 1 to 12 colours: a hunt for the longest life, or long, even battles -->
          <div id="huntModeLabel" class="field-label">Hunt mode</div>
          <div id="huntGoals" class="nav-shapes"></div>  <!-- what the hunt looks for, over its button -->
          <button id="huntBtn" type="button" class="wide"></button>  <!-- its words in its tooltip: the hunt and the zone (see renderHunt) -->
          <p id="huntStatus" class="muted"></p>
          <div id="huntTop" class="mode-list" role="listbox"></div>
        </div>
      </section>

      <section id="walkStartSection">  <!-- a walk's start, as Life's: its start on a surface (startRow, placed by the mode: a creature's in its own Start, see renderAntRow), then the number walked (a start's by the digits, Life's or a creature's, under its Digits tab), or a battle's numbers -->
        <h2 data-icon="play">Start</h2>
        <div id="startRow" class="stepper" title="Turned copies of a start draw the same walk, turned: one start per different walk. Hover to see them all" hidden>
          <button id="startDown" title="Previous start">−</button>
          <span class="field"><input id="startLabel" type="text" inputmode="numeric" maxlength="7" spellcheck="false" autocomplete="off" title="Type a start number, then Enter"><button class="enter" type="button" tabindex="-1" title="Start here (Enter)">↵</button></span>
          <button id="startUp" title="Next start">+</button>
        </div>
        <div id="numberPicker">  <!-- the number, its formula, its tabs, its primes' menus: one block, placed by the mode -->
          <div class="field-label with-btn">Formula<button id="copyNumber" class="bubble" type="button" hidden></button></div>  <!-- not a label: a click on ↵ would focus the field again -->
          <div class="field formula-field"><input id="formula" type="text" value="1/112" spellcheck="false" autocomplete="off" aria-label="Formula"
                   title="Typed in base 10, then written in the base its use needs (the walk's, or Life's: K + 1, its colours and dead), as the chip beside it says. Any number as a formula: pi, e, phi, gamma, catalan, erdos, rho, sqrt(3), cbrt(2), root(x, k), ln(x), exp(x), log(x, b), zeta(k), 22/7, 2^pi, 8^(1/3), 2^127-1, primorial(p)+1, randprime(size, seed), and + − × ÷ ^ ( ). Digit sequences, used alone: random(seed), champernowne, primes, primegaps, dragon. Press Enter to compute"><button class="enter" type="button" tabindex="-1" title="Compute (Enter)">↵</button></div>
          <div id="numberList"></div>
          <label id="mersenneRow" hidden>Prime
            <select id="mersenneP"></select>
          </label>
          <label id="primorialRow" hidden>Prime
            <select id="primorialP"></select>
          </label>
        </div>
        <div id="battleStart" hidden>  <!-- a battle's: how they fight, each walker's formula (A's the number's own, moved here: see renderWalkTeams), Random, the longest battles (see 7.6c) -->
          <div id="startWays" class="nav-shapes" hidden></div>  <!-- a battle's starts: Symmetric, Centred, Random, over the start row (see renderWalkTeams) -->
          <div class="field-label">Battle rule</div>
          <div id="battleRuleCards" class="mode-list rule-cards" role="listbox"></div>  <!-- a battle's way with an enemy's body: the Land grids, Land cells, Cut, Land no collision, as cards (see BATTLE_RULES) -->
          <div class="stack">  <!-- the walkers' formulas and Random, as close as cards -->
            <div id="formulaAHome"></div>  <!-- (the number's formula field, A's in a battle) -->
            <div id="rivalFormulas"></div>  <!-- the other walkers' formulas, B to L (see rivalField) -->
            <button id="battleRandom" type="button" class="wide" data-icon="dice" title="As many numbers as walkers drawn at random from the hunt's (the Number cards' reals and sequences, √2 to √9999), fought here">Roll</button>  <!-- (see battleRandom) -->
          </div>
          <div id="battleHuntVary" class="nav-shapes"></div>  <!-- what the hunt varies: Formulas, Starts (see renderBattleHunt) -->
          <div id="battleHuntRank" class="nav-shapes"></div>  <!-- what it ranks: Longest, Even lands, Latest first stop (see HUNT_RANKS) -->
          <button id="battleHuntBtn" type="button" class="wide"></button>  <!-- its words and tooltip: see renderBattleHunt -->
          <p id="battleHuntStatus" class="muted"></p>
          <div id="battleHuntTop" class="mode-list" role="listbox"></div>  <!-- the 8 longest battles: a click plays one -->
        </div>
      </section>

      <section id="walkRuleSection">  <!-- a walk's rule or a creature's (Ant, Turmite, Worm): its rules' cards (a command per digit), Spiral; a walk's along the grid or on cells -->
        <h2 data-icon="turtle">Walking rule</h2>
        <div id="walkOn" class="nav-shapes"></div>  <!-- along the grid, or on cells: one choice, a tab group of tiles (as the Start's), first, above How it works -->
        <button id="walkRuleHow" class="wide how-it-works" data-icon="info" type="button" title="The rule in use, step by step: what each cell (each step) sees, and what it does (a click on a rule card's picture, too)">How it works</button>  <!-- how the rule works (see walkTutorialToggle), on its first card -->
        <div id="navRules" class="mode-list rule-cards" role="listbox"></div>  <!-- the rules of that shape, where there are several; a walk by a rule: its rules' cards; a creature's, the creatures, the one in use with its rules (see ruleCards) -->
        <div id="antCustomRow" hidden><div id="antRuleName" class="field-label"></div>  <!-- not a label: a click on ↵ would focus the field again; moved right after its card (see ruleCards) -->
          <span class="field"><input id="antRule" class="custom rule" type="text" autocomplete="off" spellcheck="false" title="Type a rule, then Enter"><button class="enter" type="button" tabindex="-1" title="Apply (Enter)">↵</button></span>
        </div>
        <label hidden>Walk mode (menu kept as the source of truth for the tabs in the header)

              <option value="turtleCells">Squares (from cell to cell, by a rule)</option>
              <option value="triTurtleCells">Triangles (from cell to cell, by a rule)</option>
              <option value="hexTurtleCells">Hexagons (from cell to cell, by a rule)</option>
              <option value="cairo">Cairo pentagons (by a rule)</option>

              <option value="turmite">Squares turmite — base 2 (an ant with states)</option>
              <option value="antTri">Triangles ant — base 2 (Langton's ant)</option>

              <option value="antHex">Hexagons ant — base 2 (Langton's ant)</option>
              <option value="antCairo">Cairo pentagons ant — base 2 (Langton's ant)</option>
            </optgroup>

              <option value="cubeGrid">Cube — base 3 (left / forward / right)</option>
              <option value="cubeFlat">Cube — base 3 (left / forward / right)</option>
              <option value="antCube">Cube ant — base 2 (Langton's ant)</option>

              <option value="kleinGrid">Klein bottle — base 3 (left / forward / right)</option>
              <option value="kleinWalk">Klein bottle — base 3 (left / forward / right)</option>
              <option value="kleinHexGrid">Klein bottle of hexagons — base 2 (left / right)</option>
              <option value="kleinTriGrid">Klein bottle of triangles — base 5 (5 relative turns)</option>
              <option value="kleinHexWalk">Klein bottle of hexagons — base 5 (5 relative turns)</option>
              <option value="kleinTriWalk">Klein bottle of triangles — base 2 (left / right)</option>
              <option value="kleinCairoWalk">Klein bottle of Cairo pentagons — base 4 (4 edges out)</option>
              <option value="mobiusCairoWalk">Möbius strip of Cairo pentagons — base 4 (4 edges out)</option>
              <option value="mobiusTriGrid">Möbius strip of triangles — base 5 (5 relative turns)</option>
              <option value="mobiusTriWalk">Möbius strip of triangles — base 2 (left / right)</option>
              <option value="tetraGrid">Tetrahedron — base 5 (5 relative turns)</option>
              <option value="tetraLR">Tetrahedron — base 2 (left / right)</option>
              <option value="octaGrid">Octahedron — base 5 (5 relative turns)</option>
              <option value="octaLR">Octahedron — base 2 (left / right)</option>
              <option value="stellaGrid">Stella octangula (two tetrahedra) — base 5 (5 relative turns)</option>
              <option value="stellaLR">Stella octangula (two tetrahedra) — base 2 (left / right)</option>
              <option value="dodecaGrid">Dodecahedron (pentagons cut into 5 triangles) — base 5 (5 relative turns)</option>
              <option value="dodecaLR">Dodecahedron (pentagons cut into 5 triangles) — base 2 (left / right)</option>
              <option value="icosaGrid">Triangle sphere (icosahedron) — base 5 (5 relative turns)</option>
              <option value="icosaLR">Triangle sphere (icosahedron) — base 2 (left / right)</option>
              <!-- set aside (see MODES in main.js):

            </optgroup>
            <optgroup label="3D walks">
              <option value="cubeRel">Cubes (along the grid, by a rule)</option>
              <option value="diag">Diagonals — base 8 (8 cube corners)</option>

              <option value="diagCells">Diagonals — base 8 (truncated octahedra)</option>
              <option value="diamond">Diamond (a polymer chain, by a rule)</option>

              <option value="life2d">Life — square grid</option>

            </optgroup>
            <optgroup label="Automata on surfaces">
              <option value="lifeCube">Life — cube</option>

              <option value="lifeBumps">Life — cube with bumps</option>

              <option value="lifeFrame">Life — cube's frame</option>
              <option value="lifeFrameTetrakis">Life — cube's frame</option>
              <option value="lifeMenger">Life — Menger's sponge</option>

              <option value="lifeTorus">Life — torus</option>
              <option value="blocksTorus">Rewind — torus of squares in blocks of 4, 3 squares round it</option>

              <option value="blocksTorusTri">Rewind — torus of triangles in blocks of 6</option>
              <option value="blocksTorusCairo">Rewind — torus of Cairo pentagons in blocks of 4</option>
              <option value="blocksTorusTetrakis">Rewind — torus of tetrakis triangles in squares of 4, stellated</option>
              <option value="blocksMobius">Rewind — Möbius strip of squares in blocks of 4</option>
              <option value="blocksMobiusTri">Rewind — Möbius strip of triangles in blocks of 6</option>

              <option value="blocksKlein">Rewind — Klein bottle of squares in blocks of 4</option>

              <option value="blocksKleinTetrakis">Rewind — Klein bottle of tetrakis triangles, stellated</option>
              <option value="lifeTorusHex">Life — torus</option>
              <option value="lifeTorusCairo">Life — torus</option>
              <option value="lifeTorusTri">Life — torus</option>
              <option value="lifeTorusKite">Life — torus</option>
              <option value="lifeMobius">Life — Möbius strip</option>
              <option value="lifeMobiusHex">Life — Möbius strip</option>
              <option value="lifeMobiusTri">Life — Möbius strip</option>
              <option value="lifeMobiusCairo">Life — Möbius strip</option>
              <option value="lifeMobiusKite">Life — Möbius strip</option>
              <option value="lifeKlein">Life — Klein bottle</option>
              <option value="lifeKleinHex">Life — Klein bottle</option>
              <option value="lifeKleinTri">Life — Klein bottle</option>
              <option value="lifeKleinCairo">Life — Klein bottle</option>
              <option value="lifeKleinKite">Life — Klein bottle</option>
              <option value="lifeTetra">Life — tetrahedron</option>
              <option value="lifeOcta">Life — octahedron</option>
              <option value="lifeTetraKite">Life — tetrahedron</option>
              <option value="lifeTetraHex">Life — tetrahedron</option>
              <option value="lifeOctaKite">Life — octahedron</option>
              <option value="lifeOctaHex">Life — octahedron</option>
              <option value="lifeStella">Life — stella octangula</option>
              <option value="lifeDodeca">Life — dodecahedron</option>
              <option value="lifeIcosa">Life — icosahedron</option>
              <option value="lifeIcosaKite">Life — icosahedron</option>
              <option value="lifeStellaKite">Life — stella octangula</option>
              <option value="lifeStellaHex">Life — stella octangula</option>
              <option value="lifeDodecaKite">Life — dodecahedron</option>
              <option value="lifeDodecaHex">Life — dodecahedron</option>
              <option value="lifeCubocta">Life — cuboctahedron</option>
              <option value="lifePyramid">Life — square pyramid</option>
              <option value="lifeRhombi">Life — rhombicuboctahedron</option>
              <option value="lifeBicupola">Life — square orthobicupola</option>
              <option value="lifeGlobe">Life — globe</option>
              <option value="lifeHexSphere">Life — hexagon sphere</option>
              <option value="lifeTwistedSphere">Life — twisted sphere</option>
              <option value="loopsTorus">Replicators — torus of squares</option>
              <option value="loopsCube">Replicators — cube of squares</option>
              <option value="loopsPits">Replicators — cube with pits</option>
              <option value="loopsBumps">Replicators — cube with bumps</option>
              <option value="loopsFrame">Replicators — cube's frame</option>
            </optgroup>
            <optgroup label="2D spirals">
              <option value="spiral">Ulam square spiral — base 2 (1 = draw, 0 = skip)</option>
              <option value="triSpiral">Ulam triangle spiral — base 2 (1 = draw, 0 = skip)</option>
              <option value="hexSpiral">Ulam hexagon spiral — base 2 (1 = draw, 0 = skip)</option>
              <option value="cairoSpiral">Cairo pentagon spiral — base 2 (1 = draw, 0 = skip)</option>

        </label>
      </section>

      <section id="returnSection" hidden>  <!-- a reversible one: its return to its start, past what is played -->
        <h2 data-icon="search">Return to the start</h2>
        <button id="backBtn" type="button" class="wide" title="Steps its start on, past what is played, till it comes back to it (a reversible rule always does). Recommended on a small grid: a large one's start comes back after far too many generations to be found"></button>  <!-- blocks: see searchBack -->
      </section>

      <section id="automataSection" hidden>  <!-- Life: its rule -->
        <h2 data-icon="glider">Rule</h2>
        <div id="ruleTabs" class="nav-shapes"></div>  <!-- Elementary's: Main | Others -->
        <button id="watchRule" class="wide how-it-works" data-icon="info" type="button" title="The rule in use, step by step: what each cell (each step) sees, and what it does (a click on a rule card's picture, too)">How it works</button>  <!-- how the rule in use works (see ruleTutorial), on its first card -->
        <div id="ruleCards" class="mode-list rule-cards" role="listbox"></div>  <!-- the rules for the grid's shape, as cards -->
        <div class="rule-build">  <!-- your own: the states (a cell's: alive, its dying stages, dead), how many live neighbours give birth, let survive -->
          <div class="build-cols">  <!-- two frames side by side: Birth, Survive -->
            <div class="build-box"><h4>Birth</h4><div id="ruleBirth" class="nchips"></div></div>
            <div class="build-box"><h4>Survive</h4><div id="ruleSurvive" class="nchips"></div></div>
          </div>
          <div id="statesRow" class="stepper">  <!-- the states: alive, its dying stages, dead -->
            <button id="statesDown" type="button" title="Fewer states: one dying stage less">−</button>
            <span id="statesLabel"></span>
            <button id="statesUp" type="button" title="More states: one dying stage more">+</button>
          </div>
        </div>
        <div id="lifeCustomRow">
          <span class="field"><input id="lifeRule" class="custom rule" type="text" value="B3/S23" autocomplete="off" spellcheck="false" title="Type a rule, then Enter"><button class="enter" type="button" tabindex="-1" title="Apply (Enter)">↵</button></span>
        </div>
      </section>

      </div>
      <div id="galleryPane" hidden>
      <section>  <!-- the Gallery (kept in this browser only) as a JSON file: to keep, or to bring to another browser; or erased (Save: the ☆ of Gallery's tab) -->
        <h2 id="galleryToolsHead">Management<button type="button" class="head-btn gallery-close" title="Back to the settings, the Gallery shut">Close</button></h2>  <!-- (its picture: see the tools below) -->
        <div id="galleryTools" class="nav-shapes"></div>  <!-- Import, Export, Erase all -->
        <button id="eraseConfirm" type="button" class="wide" hidden></button>  <!-- Erase all, then this to confirm -->
        <input id="galleryFile" type="file" accept="application/json,.json" hidden>
      </section>
      <div id="yourList" role="listbox"></div>  <!-- the Gallery: the tab in use's (see fillGalleryList) -->
      </div>
    </aside>

    <div id="stage" class="stage">
      <canvas id="gridLayer"></canvas>
      <canvas id="fillLayer"></canvas>
      <canvas id="gpuLayer"></canvas>  <!-- the surfaces, walks and Life, drawn by WebGPU (see 11.4d) -->
      <canvas id="pathLayer"></canvas>
      <canvas id="lineLayer"></canvas>
      <canvas id="hoverLayer"></canvas>  <!-- a size's motif, the starts: the others faded under it (see drawHover) -->
      <canvas id="overlayLayer"></canvas>
      <div class="hint"><div id="tip"></div><div id="hint" hidden></div></div>  <!-- what the mouse is on: a tooltip, or on the view how to move it -->
      <div id="ruleTuto" class="rule-tuto" hidden></div>  <!-- how the rule picked works, in place of the grid (see ruleTutorial) -->
      <div id="animBar" class="stage-box stage-bar" tabindex="-1" aria-label="What is walked, animation and stats">  <!-- (tabindex: on a touch screen, a tap on it opens it) -->
        <div class="stage-more">  <!-- shown on hover, above the title: the bar grows upwards, its title, gauges and Play row stay where they were (a link in them clicked as it was seen) -->
          <p class="bar-sub"><span id="description"></span><span id="status"></span></p>  <!-- the walk, then how its digits came (computing, an error…) -->
          <div id="ruleChips" class="rule-chips"></div>
          <div id="gauges" class="ranking gauges" hidden></div>  <!-- one colour: alive, its peak, order…; a walk: its position, its distance, its peak, its cells (open only) -->
          <div id="digitStrip" class="strip" aria-label="Recent digits"></div>
          <canvas id="activity" class="activity" aria-label="Activity: a walk's distance from its start, Life's live cells"></canvas>
          <div class="length-row">  <!-- the digits being computed, under the curve -->
            <div id="digitsRow">  <!-- the digits being computed: their gauge, while they take long (the length asked: in the header, see max-steps) -->
              <div id="progress" class="progress"><div id="progressBar"></div><span id="progressText"></span></div>  <!-- in the length's place, while the digits take long -->
            </div>
          </div>
        </div>
        <div class="step-line"><span id="stepNow"></span><span id="stepLast"></span><span id="stepEnd"></span><span id="barLoop" class="bubble gold" hidden></span></div>  <!-- the step or generation shown (open: its last after it, see updateStats) -->
        <div class="bar-title"><span id="barNum" class="bar-num"></span><button id="barBase" class="bubble" type="button"></button><button id="barRule" class="bubble how-it-works" type="button" hidden></button><button id="barBattle" class="bubble how-it-works" type="button" hidden></button><span id="rankTitles" class="rank-titles" hidden></span></div>  <!-- the ranking's column titles (see paintRanking), on the rule's line (folded: its first) -->
        <div id="ranking" class="ranking" hidden></div>  <!-- a battle: the colours ranked by live cells, those died out last -->
        <div class="player-controls">  <!-- the buttons, as wide folded or not; on hover, the speed on their right -->
          <div class="player-main">
            <div class="row play-row">
              <button id="restart" data-icon="start" title="Jump to the start, through its stops (R)" aria-label="Jump to the start"></button>
              <button id="back" data-icon="back" title="One step back (←); a Game of Life's computed again from gen 0 (no rule backwards), at once round its loop" aria-label="One step back"></button>
              <button id="reverse" data-icon="reverse" title="Play backwards, back to the start (its rule run backwards)" aria-label="Play backwards"></button>
              <button id="stop" data-icon="stop" title="Stop (Space)" aria-label="Stop"></button>
              <button id="play" title="Play (Space)" aria-label="Play"></button>
              <button id="step" data-icon="step" title="One step (→)" aria-label="One step"></button>
              <button id="end" data-icon="end" title="Jump to the end, through its stops (E)" aria-label="Jump to the end"></button>  <!-- (a run with an end known at once: a walk; Life, a reversible one: its green link and +10k) -->
              <button id="jump10k" title="10,000 generations ahead (E, while its end is not known)">+10k</button>
            </div>
          </div>
          <div class="player-side">
            <div id="speedField" class="notch-field" title="The speed: steps (or generations) a second, a notch each, as played at the screen's rhythm">  <!-- the speed: a notched slider, the speed played at its right -->
              <span id="speedGauge" class="size-gauge"></span><span id="speedLabel"></span>
            </div>
          </div>
        </div>
      </div>
      <div id="viewTools" class="stage-box display-menu">
        <div class="stage-head" id="viewHead">  <!-- the page and the sky behind a 3D view, tiles on the right: System always in sight; the sky, Light and Dark on its left while the box is open (see applyTheme) -->
          <div id="themeButtons" class="nav-shapes head-tiles"></div>
          <select id="theme" hidden>
            <option value="light" title="The page light">Light</option>
            <option value="dark" title="The page dark">Dark</option>
            <option value="system" title="The page light or dark, as the system is set">System</option>
          </select>
          <select id="sky" hidden>
            <option value="sky">Twilight</option>  <!-- Dawn on a light page (see renderSkyButtons) -->
            <option value="plain">Plain sky</option>
          </select>
        </div>
        <div class="stage-more">  <!-- shown on hover, below -->
          <div>  <!-- Sound, Auto-fit, Grid (see renderHeadTiles) -->
            <div id="headTiles" class="nav-shapes"></div>
            <div hidden>  <!-- their checkboxes, the source -->
              <label id="autoFitRow" title="Fit the view to the walk and keep it fitted (F or double-click)"><input id="autoFit" type="checkbox" checked></label>
              <label id="gridRow" title="The grid's lines (hover for the display settings)"><input id="showGrid" type="checkbox" checked></label>
            </div>
          </div>
          <div id="viewSection" class="form-section">  <!-- the view (Default, Upright or Free, its switches as tiles), then its form -->
            <div id="viewModes" class="nav-shapes" hidden></div>  <!-- Default view | Upright | Free, tabs (see renderViewModes) -->
            <div hidden>  <!-- their checkboxes, the source (a row hidden: it does not apply) -->
              <label id="centeredRow" hidden title="On a solid, the camera keeps the walker in front as it walks, and faces the middle of a walk shown whole; elsewhere, the camera as it starts (turning the view frees it)"><input id="centered" type="checkbox" checked> <span id="centeredName">Centered pattern</span></label>
              <label id="uprightRow" hidden title="The view from the front, level, a drag turning it round the vertical only"><input id="upright" type="checkbox"></label>
            </div>
            <div id="viewTiles" class="nav-shapes view-tiles" hidden></div>  <!-- the view's switches as tiles (see renderViewTiles) -->
            <div hidden>  <!-- their checkboxes, the source (a row hidden: it does not apply) -->
              <label class="check" id="perspectiveRow" hidden><input id="perspective" type="checkbox"> Perspective</label>
              <label class="check" id="lightRow" hidden title="A lamp at the top left, with its glints and shadows; off, lit from the front (from the viewer, no shadows)"><input id="light" type="checkbox" checked> Side light</label>
              <label class="check" id="glassRow" hidden title="The surface see-through: every layer shows, its grid and path too, what is nearer more"><input id="glass" type="checkbox"> Glass</label>
              <label class="check" id="oceanRow" hidden title="Rainbow and battle colours in earth colours, on a sea blue"><input id="ocean" type="checkbox"> Earth</label>
              <label class="check" id="autoRotateRow" hidden title="Turn the view slowly, swaying up and down so that the top and the bottom show too; it starts Auto-fit, and a hand rotation stops it"><input id="autoRotate" type="checkbox"> Auto-rotate</label>
            </div>
            <div id="shapeRow" hidden>
              <div class="shape-slider" title="The same cells, from flat to round: drag (the walk goes on meanwhile)"><span id="shapeFlat"></span><input id="shapeM" type="range" min="0" max="1" step="0.01" aria-label="From flat to round"><span id="shapeRound"></span></div>
            </div>
            <div id="cutRow" hidden></div>  <!-- Off, E, N, Up: a notched slider (see notchRow, CUT_AXES) -->
          </div>
          <div class="form-section">  <!-- what the walk shows: colours, areas, cells -->
            <div id="coloursRow"><div id="colourButtons" class="choice-list"></div></div>
            <div id="lifeTrailRow" hidden>  <!-- Trail, on or off: its tile goes after Life's looks (see renderColourButtons) -->
              <input id="lifeTrail" type="checkbox" checked hidden>
            </div>
            <select id="colourMode" hidden>
              <option value="gradient">Rainbow along the walk</option>
              <option value="cells">Rainbow cells along the walk</option>
              <option value="visits">Rainbow by number of visits</option>
              <option value="digit">One colour per digit</option>
              <option value="mono">One colour</option>
            </select>
            <div id="fillAreasRow" hidden>  <!-- the areas the walk closes: Empty, Light (translucent) or Plain -->
              <div id="areaModes"></div>  <!-- Empty, Light, Plain: a notched slider (see notchRow) -->
              <span id="fillTooBig" class="fill-note" hidden title="Beyond 12 million tile corners in the walk's box, the areas are not filled">walk too big</span>
              <select id="area" hidden><option value="empty"></option><option value="light"></option><option value="plain"></option></select>
            </div>
            <div id="cellsLabel" class="field-label" hidden>Cells</div>
            <div id="cellModes" class="nav-shapes cell-modes" hidden></div>  <!-- a walk's or an ant's cells: Path, Cell path, Commands or States (an ant), Heatmap -->
            <label class="check" id="showPathRow" hidden title="The walk's line over the cells it colours"><input id="showPath" type="checkbox"> Show path</label>
            <label class="check" id="heatmapRow" hidden title="The cells coloured by how often the walk comes back to them"><input id="heatmap" type="checkbox"> Heatmap of visits</label>
          </div>
        </div>
      </div>
      <div id="numberPreview" class="rule-tuto number-view" hidden></div>  <!-- over the whole view -->
    </div>
  </main>

  <script src="punks.js?v=0.4.715"></script>
  <script src="loops.js?v=0.4.715"></script>
  <script src="emoji.js?v=0.4.715"></script>
  <script src="main.js?v=0.4.715"></script>
</body>
