<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penrose sphere</title>
<style>
  /* Lenia Worlds' look (lenia/index.html): its panel, its one button and its tabs */
  :root { --page-background: #0b0d12; --panel-background: #141821; --border-color: #262c39; --text-color: #d8dde8; --muted-text-color: #8a93a6; --accent-color: #7aa2ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page-background); color: var(--text-color); font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: flex; }
  #panel { width: 270px; flex: none; height: 100%; overflow-y: auto; background: var(--panel-background); border-right: 1px solid var(--border-color); padding: 12px; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted-text-color); font-size: 11.5px; margin-bottom: 10px; }
  .sec { margin: 12px 0 5px; color: var(--muted-text-color); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  /* The one button; .on is its active state, [disabled] its greyed one */
  .btn { appearance: none; border: 1px solid var(--border-color); background: #1b202b; color: var(--text-color); font: inherit; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .btn:hover { background: #222838; }
  .btn.on { background: #2b3a5e; border-color: var(--accent-color); color: #fff; }
  .btn[disabled] { opacity: .4; cursor: default; }
  /* One choice among several: buttons joined in one frame */
  .tabs { display: flex; flex-wrap: wrap; }
  .tabs .btn { border-radius: 0; margin-left: -1px; flex: 1 1 auto; }
  .tabs .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .tabs .btn:last-child { border-radius: 0 6px 6px 0; }
  .tabs .btn.on { position: relative; z-index: 1; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #stats { color: var(--muted-text-color); font-variant-numeric: tabular-nums; white-space: pre-line; }
  #list .btn { margin: 0 4px 4px 0; font-variant-numeric: tabular-nums; }
  .key span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="panel">
  <h1>Penrose sphere</h1>
  <div class="sub">Twarock–Konevtsova tilings (Hamish Todd, Bridges 2018): a Penrose rhombus tiling cut round its five-fold middle in a pentagon, laid on each face of a dodecahedron, its points joined at distance 1 along the surface.</div>
  <div class="sec">Size</div>
  <div class="row"><button id="prev" class="btn">−</button><span id="sizeLabel"></span><button id="next" class="btn">+</button></div>
  <div class="sec">Seen as</div>
  <div class="tabs" id="shapeTabs"><button class="btn on" data-shape="sphere">Sphere</button><button class="btn" data-shape="dodeca">Dodecahedron</button></div>
  <div class="sec">Tiles</div>
  <div class="key" id="key"></div>
  <div class="sec">Count</div>
  <div id="stats"></div>
  <div class="sec">Sizes that close</div>
  <div id="list"></div>
</div>
<div id="stage"><canvas id="view"></canvas></div>
<script>
  document.write(`<script src="penrose-sphere.js?${Date.now()}"><\/script>`); // (never an old one from the cache)
</script>
</body>
</html>
