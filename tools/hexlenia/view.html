<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Lenia</title>
<style>
  :root { --bg: #111; --fg: #ddd; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  #bar { padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  canvas { display: block; margin: 0 auto; }
  a { color: #8cf; }
</style>
</head>
<body>
<div id="bar"><a href="index.html">All</a><span id="info"></span><button id="play">Pause</button><button id="restart">Restart</button><label>Speed <input id="speed" type="range" min="1" max="20" value="4"></label><span id="stats"></span></div>
<canvas id="c"></canvas>
<script type="module">
// Shows one setting from the hash: #space=hex&N=48&R=4&beta=1,0.25&mu=0.2&sigma=0.02&dt=0.1&r0=6&seed=1&tilt=true (a
// disc started, as search.js does; space: hex or a tiling of tilings.json, N its size; flow=true: Flow Lenia), or a creature a result file
// kept: #from=out/creatures.json&i=3 (its setting and cells)
import { space, world, seedDisc, measure } from './core.js';
let h = Object.fromEntries(new URLSearchParams(location.hash.slice(1))), p;
if (h.from) { const o = (await (await fetch(h.from)).json())[+h.i || 0]; h = { ...o, N: o.N ?? Math.sqrt(o.cells.length), kept: o.cells }; p = o; }
else p = { R: +h.R || 4, beta: (h.beta || '1').split(',').map(Number), mu: +h.mu || 0.2, sigma: +h.sigma || 0.02, dt: +h.dt || 0.1, r0: +h.r0 || 6, seed: +h.seed || 1, flow: h.flow === 'true' };
const S = space(h.space || 'hex', +h.N || 48), W = world(S, p), cv = document.getElementById('c'), g = cv.getContext('2d');
document.getElementById('info').textContent = `${h.name ? h.name + ' · ' : ''}${p.flow ? 'Flow Lenia · ' : ''}${S.name} ${S.N} · R ${p.R} · ${p.kernels ? p.kernels.length + ' kernels' : `β ${p.beta} · μ ${p.mu} · σ ${p.sigma}`} · dt ${p.dt}`;
let t = 0, on = true;
const start = () => {
  if (h.kept) W.A = Float32Array.from(h.kept, (v) => v / 255);
  else seedDisc(W, p.r0, p.seed, 1, h.tilt === 'true' || h.tilt === true);
  t = 0;
};
start();
// Each cell its own shape, the torus' parallelogram fitting the window (again when it changes: a page opened hidden
// has no size yet)
const shapes = Array.from({ length: S.n }, (_, c) => S.shape(c)), xs = shapes.flat().map((q) => q[0]), ys = shapes.flat().map((q) => q[1]);
const x0 = Math.min(...xs), y0 = Math.min(...ys), sw = Math.max(...xs) - x0, sh = Math.max(...ys) - y0;
let paths;
const fit = () => {
  const sc = Math.max(1, Math.min((innerWidth - 24) / sw, (innerHeight - 60) / sh));
  cv.width = sw * sc; cv.height = sh * sc;
  paths = shapes.map((s) => { const P = new Path2D(); s.forEach(([x, y], i) => P[i ? 'lineTo' : 'moveTo']((x - x0) * sc, (y - y0) * sc)); P.closePath(); return P; });
};
fit();
addEventListener('resize', fit);
const colour = (v) => `hsl(${240 - v * 190}, 90%, ${6 + v * 60}%)`;
function draw() {
  g.fillStyle = '#111'; g.fillRect(0, 0, cv.width, cv.height);
  for (let c = 0; c < S.n; c++) { g.fillStyle = colour(W.A[c]); g.fill(paths[c]); }
  const s = measure(W);
  document.getElementById('stats').textContent = `step ${t} · mass ${s.m.toFixed(1)} · live ${s.live}`;
}
function frame() {
  if (on) for (let i = 0; i < +document.getElementById('speed').value; i++) { W.step(); t++; }
  draw();
  requestAnimationFrame(frame);
}
document.getElementById('play').onclick = (e) => { on = !on; e.target.textContent = on ? 'Pause' : 'Play'; };
document.getElementById('restart').onclick = start;
window.hexLenia = { S, W, p, get t() { return t; } };
frame();
</script>
</body>
</html>
